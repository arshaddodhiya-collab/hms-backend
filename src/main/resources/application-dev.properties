# Dev Profile — Activate with: --spring.profiles.active=dev
# Enables verbose logging for debugging during development.

# Show SQL queries in console
spring.jpa.show-sql=true

# Application Debug Logging
logging.level.com.hms=DEBUG

# Spring Security Logging (helpful for auth issues)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# SQL Query Logging (see actual SQL + bound parameters)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
