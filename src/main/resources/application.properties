spring.application.name=HospitalManagementSystem

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true
spring.datasource.username=Arashad
spring.datasource.password=Arashad@6139
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Configuration
# 15 minutes in milliseconds
jwt.expiration=900000
# 7 days in milliseconds
jwt.refresh-expiration=604800000
# Set to true in Production (HTTPS)
app.security.secure-cookie=false
# IMPORTANT: Use a strong secret in production (at least 256 bits). Must be Base64 encoded.
# Decodes to: ThisIsASecretKeyThatIsLongEnoughForHS256Algorithm
jwt.secret=VGhpc0lzQVNlY3JldEtleVGhhdElzTG9uZ0Vub3VnaEZvckhTMjU2QWxnb3JpdGht


# General Logging Level
logging.level.root=INFO

# Application Specific Logging (Set to DEBUG to see more)
logging.level.com.hms=DEBUG

# Spring Security Logging (Crucial for Auth issues)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# SQL Query Logging (See actual SQL executed)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
