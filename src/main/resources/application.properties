spring.application.name=HospitalManagementSystem

# MySQL Configuration — Use environment variables in production
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:Arashad}
spring.datasource.password=${DB_PASSWORD:Arashad@6139}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Configuration
# 15 minutes in milliseconds
jwt.expiration=900000
# 7 days in milliseconds
jwt.refresh-expiration=604800000
# Set to true in Production (HTTPS)
app.security.secure-cookie=${SECURE_COOKIE:false}
# IMPORTANT: Use a strong, unique secret in production (at least 256 bits, Base64 encoded).
jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3JldEtleVGhhdElzTG9uZ0Vub3VnaEZvckhTMjU2QWxnb3JpdGht}

# Logging — Production-safe levels (use 'dev' profile for debug logging)
logging.level.root=INFO
logging.level.com.hms=INFO
